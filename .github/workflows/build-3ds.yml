name: Build 3DS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nintendo 3DS packages
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake make pkg-config
          dkp-pacman -Sy --noconfirm --needed 3dstools

      - name: Build CIA and 3DSX
        run: ./platform/3ds/build.sh

      - name: Verify outputs and public boundary
        run: |
          VERSION="$(tr -d '\r\n' < platform/3ds/version.txt)"
          git diff --check
          ! git ls-files | grep -Ei '(^|/)[^/]*\.(z64|n64|v64|sav|sra|fla|eep)$'
          ! git ls-files | grep -E '(^|/)(AGENTS\.md|PROTOCOL\.md|WORKFLOW\.md|GITHUB_RELEASE_WORKFLOW\.md)$'
          test -f "build-3ds/game/mk64-3ds-v${VERSION}.3dsx"
          test -f "build-3ds/game/mk64-3ds-v${VERSION}.cia"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mk64-3ds-packages
          if-no-files-found: error
          path: |
            build-3ds/game/mk64-3ds-v*.3dsx
            build-3ds/game/mk64-3ds-v*.cia
